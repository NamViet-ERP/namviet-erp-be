# Integration branch is `dev`. Production deploy branch is `main`.
name: CI

on:
  push:
    branches: [dev, main, production, feature/purchasing]
  pull_request:
    branches: [dev, main, production, feature/purchasing]

jobs:
  backend:
    name: BE build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release

      - name: Publish API
        run: dotnet publish src/ApiHost/NamViet.ERP.Api -c Release -o ./publish

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: be-publish
          path: publish/
          if-no-files-found: error
          retention-days: 7
