# Runs on branch `production` — change `branches` when you switch to main/master.
name: CI

on:
  push:
    branches: [production]
  pull_request:
    branches: [production]

jobs:
  backend:
    name: BE build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release
