# ==============================================================================
# Cấu hình Nginx chuẩn Production cho NamViet ERP (50 người dùng)
# Hỗ trợ: Static SPA, API Reverse Proxy, WebSocket SignalR, Gzip, Security Headers
# ==============================================================================

# Giới hạn kích thước file upload chứng từ / hợp đồng / CV
client_max_body_size 25M;

# 1. Bật Gzip nén tĩnh tối ưu tốc độ tải trang
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/x-javascript
    application/xml
    application/xml+rss
    image/svg+xml;

# Upstream Backend .NET 8 API
upstream backend_api {
    server api:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name web.n3tworks.io.vn;

    # Nếu dùng Cloudflare SSL Flexible hoặc certbot trên host:
    # return 301 https://$host$request_uri;

    root /usr/share/nginx/html;
    index index.html;

    # Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://namviet-erp-api.onrender.com wss: http: https:; frame-ancestors 'none';" always;

    # 2. Reverse Proxy cho Backend REST API
    location /api/ {
        proxy_pass http://backend_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout cho các báo cáo hoặc file upload lớn
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # 3. Reverse Proxy cho SignalR Hubs (BẮT BUỘC có Upgrade WebSocket)
    location /hubs/ {
        proxy_pass http://backend_api/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 4. Health check endpoint (cho load balancer / monitoring)
    location /health {
        proxy_pass http://backend_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /health/ready {
        proxy_pass http://backend_api/health/ready;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 5. Phục vụ file upload tĩnh an toàn (nếu cấu hình)
    # Lưu ý: Các upload nhạy cảm qua /api/hr/files được kiểm soát quyền bằng JWT

    # 6. Frontend SPA routing (tất cả route client trả về index.html)
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Cache tài nguyên tĩnh (JS, CSS, hình ảnh có hash tên file)
    location ~* \.(?:css|js|woff2?|svg|gif|png|jpg|jpeg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Chặn triệt để file source map (.map) và file cấu hình ẩn (.env, .git)
    location ~* \.(?:map|env.*|git.*)$ {
        deny all;
        return 404;
    }
}
