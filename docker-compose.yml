services:
  postgres:
    image: postgres:16-alpine
    container_name: namviet-erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-namviet_erp}
      POSTGRES_USER: ${POSTGRES_USER:-erp_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - namviet_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp_admin} -d ${POSTGRES_DB:-namviet_erp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrator:
    image: mcr.microsoft.com/dotnet/sdk:8.0.412
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-namviet_erp};Username=${POSTGRES_USER:-erp_admin};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - dotnet
      - run
      - --project
      - scripts/DatabaseMigrator/DatabaseMigrator.csproj
      - --configuration
      - Release
      - --
      - migrate

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: namviet-erp-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@namviet.vip}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD in .env}
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  namviet_pgdata:
